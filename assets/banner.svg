<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <linearGradient id="primaryTextGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="badgeGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#0369a1" stop-opacity="0.1" />
    </linearGradient>

    <linearGradient id="badgeGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#4338ca" stop-opacity="0.1" />
    </linearGradient>

    <linearGradient id="badgeGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#6d28d9" stop-opacity="0.1" />
    </linearGradient>

    <linearGradient id="beamGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="beamGrad2" x1="100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0" />
      <stop offset="50%" stop-color="#c084fc" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </linearGradient>

    <!-- Filters for Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="60" result="blur" />
    </filter>
  </defs>

  <style>
    @keyframes pulseOrb1 {
      0%, 100% { transform: scale(1) translate(0, 0); opacity: 0.35; }
      50% { transform: scale(1.25) translate(40px, -20px); opacity: 0.6; }
    }
    @keyframes pulseOrb2 {
      0%, 100% { transform: scale(1) translate(0, 0); opacity: 0.3; }
      50% { transform: scale(1.3) translate(-30px, 30px); opacity: 0.55; }
    }
    @keyframes moveScanline {
      0% { transform: translateY(-420px); opacity: 0; }
      50% { opacity: 0.6; }
      100% { transform: translateY(420px); opacity: 0; }
    }
    @keyframes floatParticle {
      0% { transform: translateY(0px) translateX(0px); opacity: 0.2; }
      50% { transform: translateY(-25px) translateX(15px); opacity: 0.8; }
      100% { transform: translateY(0px) translateX(0px); opacity: 0.2; }
    }
    @keyframes circuitFlow {
      0% { stroke-dashoffset: 400; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes rotateRing {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .orb-1 { animation: pulseOrb1 8s ease-in-out infinite; transform-origin: 200px 100px; }
    .orb-2 { animation: pulseOrb2 10s ease-in-out infinite; transform-origin: 1000px 300px; }
    .scanner { animation: moveScanline 6s linear infinite; }
    .particle-1 { animation: floatParticle 5s ease-in-out infinite; }
    .particle-2 { animation: floatParticle 7s ease-in-out infinite 1s; }
    .particle-3 { animation: floatParticle 6s ease-in-out infinite 2.5s; }
    .flow-line { stroke-dasharray: 40, 160; animation: circuitFlow 5s linear infinite; }
    .flow-line-rev { stroke-dasharray: 30, 120; animation: circuitFlow 4s linear infinite reverse; }
    .rotating-ring { animation: rotateRing 25s linear infinite; transform-origin: 600px 210px; }

    .title-text {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
      font-weight: 800;
      letter-spacing: -0.02em;
    }
    .subtitle-text {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
      font-weight: 500;
      letter-spacing: 0.01em;
    }
    .badge-text {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
      font-weight: 600;
      font-size: 13px;
      letter-spacing: 0.04em;
    }
  </style>

  <!-- Deep Background Layer -->
  <rect width="1200" height="420" rx="16" fill="url(#bgGrad)" />

  <!-- Animated Glowing Nebulas / Orbs in Background -->
  <g filter="url(#softGlow)">
    <circle class="orb-1" cx="220" cy="120" r="140" fill="#0284c7" />
    <circle class="orb-2" cx="980" cy="280" r="160" fill="#7c3aed" />
    <circle cx="600" cy="210" r="100" fill="#4338ca" opacity="0.25" />
  </g>

  <!-- Cyber Grid Pattern (Subtle & strictly in background) -->
  <g opacity="0.12">
    <path d="M0,60 H1200 M0,120 H1200 M0,180 H1200 M0,240 H1200 M0,300 H1200 M0,360 H1200" stroke="#38bdf8" stroke-width="1" />
    <path d="M100,0 V420 M200,0 V420 M300,0 V420 M400,0 V420 M500,0 V420 M600,0 V420 M700,0 V420 M800,0 V420 M900,0 V420 M1000,0 V420 M1100,0 V420" stroke="#38bdf8" stroke-width="1" />
  </g>

  <!-- Decorative Dynamic Circuit Rays (Passing BEHIND the text plane) -->
  <g opacity="0.35">
    <path class="flow-line" d="M50,80 L350,80 L450,150 L750,150 L850,80 L1150,80" fill="none" stroke="url(#beamGrad1)" stroke-width="2" />
    <path class="flow-line-rev" d="M50,340 L300,340 L420,270 L780,270 L900,340 L1150,340" fill="none" stroke="url(#beamGrad2)" stroke-width="2" />
  </g>

  <!-- Dynamic Security Tech Watermark Ring (Centered, subtle opacity, behind text) -->
  <g opacity="0.1" class="rotating-ring">
    <circle cx="600" cy="210" r="150" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="8 12" />
    <circle cx="600" cy="210" r="175" fill="none" stroke="#818cf8" stroke-width="1" stroke-dasharray="25 40" />
    <circle cx="600" cy="210" r="195" fill="none" stroke="#c084fc" stroke-width="1.5" stroke-dasharray="4 8" />
  </g>

  <!-- Floating Particles / Nodes in background -->
  <g opacity="0.6">
    <circle class="particle-1" cx="150" cy="180" r="3" fill="#38bdf8" filter="url(#glow)" />
    <circle class="particle-2" cx="1050" cy="160" r="3" fill="#c084fc" filter="url(#glow)" />
    <circle class="particle-3" cx="320" cy="310" r="2.5" fill="#818cf8" />
    <circle class="particle-1" cx="880" cy="100" r="2.5" fill="#38bdf8" />
  </g>

  <!-- Subtle Scanning Laser Light in Background -->
  <g class="scanner" opacity="0.25">
    <line x1="100" y1="210" x2="1100" y2="210" stroke="url(#beamGrad1)" stroke-width="1.5" filter="url(#glow)" />
  </g>

  <!-- FOREGROUND LAYER: Text and Badges (Guaranteed clear & never obstructed) -->
  
  <!-- Security Vault Icon Badge -->
  <g transform="translate(600, 75)">
    <!-- Hexagon Outer Shield -->
    <path d="M0,-24 L20,-12 L20,12 L0,24 L-20,12 L-20,-12 Z" fill="#0f172a" stroke="#38bdf8" stroke-width="2" filter="url(#glow)" />
    <!-- Lock / Keyhole Icon in center -->
    <circle cx="0" cy="-3" r="5" fill="#38bdf8" />
    <path d="M-2,-2 L2,-2 L3,8 L-3,8 Z" fill="#38bdf8" />
  </g>

  <!-- Main Title -->
  <text class="title-text" x="600" y="160" text-anchor="middle" font-size="40" fill="url(#primaryTextGrad)" filter="url(#glow)">
    ENTERPRISE PASSWORD MANAGEMENT &amp; PAM
  </text>

  <!-- Subtitle -->
  <text class="subtitle-text" x="600" y="205" text-anchor="middle" font-size="19" fill="#94a3b8">
    Curated Ecosystem of Enterprise Vaults, Just-In-Time Access &amp; Open-Source Bastions
  </text>

  <!-- Interactive / Status Pills in Foreground -->
  <!-- Pill 1: Zero Trust -->
  <g transform="translate(230, 260)">
    <rect width="160" height="38" rx="19" fill="url(#badgeGrad1)" stroke="#0284c7" stroke-width="1.2" />
    <circle cx="24" cy="19" r="5" fill="#38bdf8" filter="url(#glow)" />
    <text class="badge-text" x="92" y="24" text-anchor="middle" fill="#e0f2fe">ZERO TRUST</text>
  </g>

  <!-- Pill 2: Secrets Vaulting -->
  <g transform="translate(410, 260)">
    <rect width="180" height="38" rx="19" fill="url(#badgeGrad2)" stroke="#6366f1" stroke-width="1.2" />
    <circle cx="24" cy="19" r="5" fill="#818cf8" filter="url(#glow)" />
    <text class="badge-text" x="102" y="24" text-anchor="middle" fill="#e0e7ff">SECRETS VAULTING</text>
  </g>

  <!-- Pill 3: JIT Infrastructure -->
  <g transform="translate(610, 260)">
    <rect width="170" height="38" rx="19" fill="url(#badgeGrad2)" stroke="#818cf8" stroke-width="1.2" />
    <circle cx="24" cy="19" r="5" fill="#a855f7" filter="url(#glow)" />
    <text class="badge-text" x="97" y="24" text-anchor="middle" fill="#f3e8ff">JIT ACCESS / PAM</text>
  </g>

  <!-- Pill 4: Open Source -->
  <g transform="translate(800, 260)">
    <rect width="170" height="38" rx="19" fill="url(#badgeGrad3)" stroke="#a855f7" stroke-width="1.2" />
    <circle cx="24" cy="19" r="5" fill="#c084fc" filter="url(#glow)" />
    <text class="badge-text" x="97" y="24" text-anchor="middle" fill="#fae8ff">SELF-HOSTED OSS</text>
  </g>

  <!-- Lower Meta Tagline -->
  <text class="subtitle-text" x="600" y="350" text-anchor="middle" font-size="14" fill="#64748b">
    🛡️ Session Recording • End-to-End Encryption • Compliance &amp; Audit Logs • Multi-Cloud PAM
  </text>

  <!-- Border Accent Outline -->
  <rect x="1" y="1" width="1198" height="418" rx="15" fill="none" stroke="#334155" stroke-width="1.5" />
</svg>
